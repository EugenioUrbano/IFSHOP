{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>🔐 Verificação em Duas Etapas</h2>
    
    {% if codigo_display %}
    <div class="alert alert-info">
        <strong>Código:</strong> {{ codigo_display }}
        <small>(Use este código para teste)</small>
    </div>
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Digite o código de 6 dígitos:</label>
            <input type="text" name="codigo" maxlength="6" 
                    pattern="\d{6}" required class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Verificar</button>
    </form>
    
    <hr>
    <small>
        <strong>Dica:</strong> Em produção, este código seria enviado por email.
        Para testes, use: <code>123456</code>
    </small>
</div>
{% endblock %}
