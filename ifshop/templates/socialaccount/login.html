{% extends "base.html" %}
{% load static %}

{% block title %}Confirmar Login - IFSHOP{% endblock %}

{% block content %}
<div class="card-body  ">
    <div class="row d-flex justify-content-center ">
        <div class="col-6 border rounded-3 py-4 shadow mx-md-n5 ">
            <div class="container">
                <div class="">
                    <a href="{% url 'login' %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="" class="bi bi-arrow-left-circle" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-4.5-.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z"></path>
                        </svg>
                    </a>
                </div>
                <div class="mb-4 text-center">
                        <h3>Continuar com Google?</h3>
                        <p class="text-muted">
                            Você será redirecionado para o Google para confirmar seu login
                        </p>
                    </div>

                    <form method="post" class="mb-4 text-center">
                        {% csrf_token %}
                        {% if redirect_field_value %}
                        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
                        {% endif %}
                        <button type="submit" class="btn btn botoes">
                            Sim, Continuar com Google
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
  </div>

{% endblock %}
